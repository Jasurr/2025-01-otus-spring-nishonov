databaseChangeLog:
  - changeSet:
      id: 2025-03-18---0005-comments
      author: Jasur
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message
                  type: varchar(255)
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: book_id
            constraintName: comments_books_fk
            referencedTableName: books
            referencedColumnNames: id
            onDelete: CASCADE