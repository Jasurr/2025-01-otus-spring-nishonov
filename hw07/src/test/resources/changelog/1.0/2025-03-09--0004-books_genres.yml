databaseChangeLog:
  - changeSet:
      id: 2025-03-09--0001--books_genres
      author: Jasur
      changes:
        - createTable:
            tableName: books_genres
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: genre_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: books_genres
            baseColumnNames: book_id
            constraintName: books_genres_books_fk
            referencedTableName: books
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: books_genres
            baseColumnNames: genre_id
            constraintName: books_genres_genres_fk
            referencedTableName: genres
            referencedColumnNames: id
            onDelete: CASCADE