databaseChangeLog:
  - changeSet:
      id: 2025-04-13--0005-comments-data
      author: Jasur
      runOnChange: true
      changes:
        - loadData:
            file: classpath:/db/changelog/data/data/2025-04-13--0005-comments.csv
            collectionName: comments
            separator: ","
            encoding: UTF-8
            relativeToChangelogFile: false
            columns:
              - column:
                  name: _id
                  type: string
              - column:
                  name: message
                  type: string
              - column:
                  name: book_id
                  type: string