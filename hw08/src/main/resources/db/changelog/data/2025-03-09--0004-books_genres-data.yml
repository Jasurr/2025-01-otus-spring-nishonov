databaseChangeLog:
    - changeSet:
          id: 2025-03-09--0004-books_genres-data
          author: Jasur
          runOnChange: true
          changes:
              - loadData:
                    file: classpath:/db/changelog/data/data/2025-03-09--0004-books_genres.csv
                    collectionName: books_genres
                    separator: ";"
                    encoding: UTF-8
                    relativeToChangelogFile: false
                    columns:
                        - column:
                              name: book_id
                              type: string
                        - column:
                              name: genre_id
                              type: string