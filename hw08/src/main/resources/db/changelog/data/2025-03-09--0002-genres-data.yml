databaseChangeLog:
    - changeSet:
          id: 2025-03-09--0002-genres-data
          author: Jasur
          runOnChange: true
          changes:
              - loadData:
                    file: classpath:/db/changelog/data/data/2025-03-09--0002-genres.csv
                    collectionName: genres
                    separator: ";"
                    encoding: UTF-8
                    relativeToChangelogFile: false
                    columns:
                        - column:
                              name: _id
                              type: string
                        - column:
                              name: name
                              type: string