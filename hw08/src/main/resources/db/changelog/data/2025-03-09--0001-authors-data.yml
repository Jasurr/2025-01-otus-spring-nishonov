databaseChangeLog:
    - changeSet:
          id: 2025-03-09--0001-authors-data
          author: Jasur
          runOnChange: true
          changes:
              - loadData:
                    file: classpath:/db/changelog/data/data/2025-03-09--0001-authors.csv
                    collectionName: authors
                    separator: ";"
                    encoding: UTF-8
                    relativeToChangelogFile: false
                    columns:
                        - column:
                              name: _id
                              type: string
                        - column:
                              name: full_name
                              type: string