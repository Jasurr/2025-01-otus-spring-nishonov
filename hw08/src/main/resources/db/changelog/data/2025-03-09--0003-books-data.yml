databaseChangeLog:
    - changeSet:
          id: 2025-03-09--0003-books-data
          author: Jasur
          runOnChange: true
          changes:
              - loadData:
                    file: classpath:/db/changelog/data/data/2025-03-09--0003-books.csv
                    collectionName: books
                    separator: ";"
                    encoding: UTF-8
                    relativeToChangelogFile: false
                    columns:
                        - column:
                              name: _id
                              type: string
                        - column:
                              name: title
                              type: string
                        - column:
                              name: author_id
                              type: string