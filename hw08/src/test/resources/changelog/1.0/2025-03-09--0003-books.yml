databaseChangeLog:
  - changeSet:
      id: 2025-03-09--0001--books
      author: Jasur
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: books_pk
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: books_authors_fk
                    references: authors(id)
                    onDelete: CASCADE