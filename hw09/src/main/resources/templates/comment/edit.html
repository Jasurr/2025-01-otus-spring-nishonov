<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Comment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px 0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }
        .button-submit {
            background-color: #2ecc71;
        }
        .button-submit:hover {
            background-color: #27ae60;
        }
        .button-cancel {
            background-color: #bdc3c7;
            color: #2c3e50;
        }
        .button-cancel:hover {
            background-color: #95a5a6;
        }
        .buttons {
            margin-top: 25px;
            text-align: center;
        }
    </style>
</head>
<body>
<h2>Edit Comment</h2>
<form th:action="@{/book/comment/{commentId}/update(commentId=${comment.id})}" method="post">
    <textarea name="message" rows="4" style="width:100%;" th:text="${comment.message}" required></textarea>
    <input type="hidden" name="bookId" th:value="${bookId}"/>
    <div class="buttons">
        <button type="submit" class="button button-submit">Save</button>
        <a th:href="@{/book/comment/{bookId}(bookId=${bookId})}" class="button button-cancel">Cancel</a>
    </div>
</form>
</body>
</html>
