<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px 0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .button-add {
            background-color: #27ae60;
        }

        .button-add:hover {
            background-color: #219150;
        }

        .button-edit {
            background-color: #2980b9;
        }

        .button-edit:hover {
            background-color: #216a94;
        }

        .button-delete {
            background-color: #c0392b;
        }

        .button-delete:hover {
            background-color: #a93226;
        }

        .table-container {
            width: 90%;
            margin: auto;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #ecf0f1;
            color: #333;
        }

        td {
            color: #555;
        }

        .action-buttons a {
            margin-right: 8px;
        }

        .top-actions {
            text-align: center;
            margin-bottom: 20px;
        }

        .button-comment {
            background-color: #8e44ad;
        }

        .button-comment:hover {
            background-color: #732d91;
        }

        a.button-home {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            margin: 0 10px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        a.button-home:hover {
            background-color: #216a94;
        }

        .buttons {
            margin-top: 25px;
            text-align: center;
        }

        .button-submit {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
            transition: background-color 0.3s ease;
        }

        .button-submit:hover {
            background-color: #27ae60;
        }

        .button-cancel {
            background-color: #bdc3c7;
            color: #2c3e50;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .button-cancel:hover {
            background-color: #95a5a6;
        }

    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.open-comment-button').forEach(btn => {
                btn.addEventListener('click', function () {
                    const bookId = this.getAttribute('data-book-id');
                    const bookTitle = this.getAttribute('data-book-title');
                    openComments(bookId, bookTitle);
                });
            });
        });

        function openComments(bookId, bookTitle) {
            document.getElementById("modalBookTitle").innerText = bookTitle;
            document.getElementById("commentBookId").value = bookId;
            document.getElementById("commentModal").style.display = "block";

            // Fetch comments
            fetch(`/book/comment/${bookId}`)
                .then(response => response.json())
                .then(comments => {
                    console.log('COMMENTS', comments)
                    let commentList = document.getElementById("commentList");
                    commentList.innerHTML = "";
                    comments.forEach(c => {
                        let li = document.createElement("li");
                        li.id = `comment-${c.id}`;
                        li.innerHTML = `
                                    <span id="comment-text-${c.id}">${c.message}</span>
                                    <button onclick="editComment(${c.id}, '${c.message.replace(/'/g, "\\'")}')">✏️</button>
                                    <button onclick="deleteComment(${c.id})">🗑️</button>
                                `;
                        commentList.appendChild(li);
                    });
                })
                .catch(error => {
                    console.error('Error fetching comments:', error);
                });
        }

        function closeModal() {
            document.getElementById("commentModal").style.display = "none";
        }

        function saveComment() {
            let bookId = document.getElementById("commentBookId").value;
            let message = document.getElementById("message").value;

            fetch(`/book/comment/${bookId}`, {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message})
            }).then(() => {
                openComments(bookId, document.getElementById("modalBookTitle").innerText);
                document.getElementById("message").value = "";
            });
        }

        function editComment(commentId, oldMessage) {
            const newMessage = prompt("Edit comment:", oldMessage);
            if (newMessage !== null) {
                if (newMessage.trim() === "") {
                    alert("Comment cannot be empty.");
                    return;
                }
                if (newMessage === oldMessage) {
                    alert("No changes made.");
                    return;
                }
                let bookId = document.getElementById("commentBookId").value;
                fetch(`/book/comment/${commentId}`, {
                    method: "PUT",
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: newMessage, bookId})
                }).then(() => {
                    document.getElementById(`comment-text-${commentId}`).innerText = newMessage;
                }).catch(error => {
                    console.error('Error updating comment:', error);
                });
            }
        }

        function deleteComment(commentId) {
            if (confirm("Are you sure you want to delete this comment?")) {
                fetch(`/book/comment/${commentId}`, {
                    method: "DELETE"
                }).then(() => {
                    const li = document.getElementById(`comment-${commentId}`);
                    if (li) li.remove();
                });
            }
        }
    </script>
</head>
<body>

<h2>Books</h2>

<div class="top-actions">
    <a href="/" class="button-home">Home</a>
    <a th:href="@{/book/add}" class="button button-add">Add New Book</a>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genres</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author.fullName}">Author</td>
            <td>
                <span th:each="genre, iterStat : ${book.genres}">
                    <span th:text="${genre.name}"></span><span th:if="${!iterStat.last}">, </span>
                </span>
            </td>
            <td class="action-buttons">
                <a th:href="@{'/book/edit/' + ${book.id}}" class="button button-edit">Edit</a>
                <a th:href="@{'/book/delete/' + ${book.id}}" class="button button-delete"
                   onclick="return confirm('Are you sure you want to delete this book?');">Delete</a>

                <a href="javascript:void(0);" class="button button-comment open-comment-button"
                   th:attr="data-book-id=${book.id}, data-book-title=${book.title}">
                    Comments
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div id="commentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background-color:rgba(0,0,0,0.6); z-index:1000;">
    <div style="background:#fff; max-width:600px; margin:100px auto; padding:20px; border-radius:8px; position:relative;">
        <h3>Comments for: <span id="modalBookTitle"></span></h3>

        <ul id="commentList">
            <!-- Comments will be dynamically inserted here -->
        </ul>
        <form id="commentForm">
            <textarea id="message" rows="4" style="width:100%;" placeholder="Enter your comment"></textarea>
            <input type="hidden" id="commentBookId"/>
            <div class="buttons">
                <button type="button" class="button-submit" onclick="saveComment()">Submit</button>
                <button type="button" class="button-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </form>
        <button onclick="closeModal()" style="position:absolute; top:10px; right:10px;">X</button>
    </div>
</div>

</body>
</html>
