<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Book</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #34495e;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        select[multiple] {
            height: 120px;
        }

        .buttons {
            margin-top: 25px;
            text-align: center;
        }

        button, a.button-cancel {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            margin: 0 10px;
            display: inline-block;
        }

        a.button-cancel {
            background-color: #7f8c8d;
        }

        button:hover {
            background-color: #219150;
        }

        a.button-cancel:hover {
            background-color: #707b7c;
        }
    </style>
</head>
<body>

<h2>Add New Book</h2>

<form th:action="@{/book/add}" method="post">
    <label for="title">Title</label>
    <input type="text" id="title" th:field="${book.title}" placeholder="Enter book title" required/>

    <label for="author">Author</label>
    <select id="author" th:field="${book.author}" required>
        <option value="" disabled selected>Select author</option>
        <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.fullName}"></option>
    </select>

    <label for="genres">Genres</label>
    <select id="genres" th:field="${book.genres}" multiple required>
        <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}"></option>
    </select>

    <div class="buttons">
        <button type="submit">Save</button>
        <a href="/book" class="button-cancel">Cancel</a>
    </div>
</form>

</body>
</html>
