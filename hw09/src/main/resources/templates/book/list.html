<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px 0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }
        .button-add {
            background-color: #27ae60;
        }
        .button-add:hover {
            background-color: #219150;
        }
        .button-edit {
            background-color: #2980b9;
        }
        .button-edit:hover {
            background-color: #216a94;
        }
        .button-delete {
            background-color: #c0392b;
        }
        .button-delete:hover {
            background-color: #a93226;
        }
        .table-container {
            width: 90%;
            margin: auto;
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #ecf0f1;
            color: #333;
        }
        td {
            color: #555;
        }
        .action-buttons a, .action-buttons button {
            margin-right: 8px;
        }
        .top-actions {
            text-align: center;
            margin-bottom: 20px;
        }
        .button-comment {
            background-color: #8e44ad;
        }
        .button-comment:hover {
            background-color: #732d91;
        }
        a.button-home {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            margin: 0 10px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        a.button-home:hover {
            background-color: #216a94;
        }
    </style>
</head>
<body>
<h2>Books</h2>

<div class="top-actions">
    <a href="/" class="button-home">Home</a>
    <a th:href="@{/book/add}" class="button button-add">Add New Book</a>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genres</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author.fullName}">Author</td>
            <td>
                <span th:each="genre, iterStat : ${book.genres}">
                    <span th:text="${genre.name}"></span><span th:if="${!iterStat.last}">, </span>
                </span>
            </td>
            <td class="action-buttons">
                <a th:href="@{'/book/edit/' + ${book.id}}" class="button button-edit">Edit</a>
                <a href="javascript:void(0);" class="button button-delete" th:attr="data-book-id=${book.id}" th:onclick="|deleteBook(${book.id})|">Delete</a>
                <a th:href="@{/book/comment/{bookId}(bookId=${book.id})}" class="button button-comment">Comments</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script>
    function deleteBook(bookId) {
        if (confirm('Are you sure you want to delete this book?')) {
            fetch(`/book/delete/${bookId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    window.location.href = '/book';
                } else {
                    alert('Error deleting book');
                }
            }).catch(error => {
                console.error('Error:', error);
                alert('Error deleting book');
            });
        }
    }
</script>
</body>
</html>
